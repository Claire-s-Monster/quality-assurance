---
# CI pipeline using ci-framework reusable workflow
name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@8f6fe6495de08228f74fa51f92070b131911d268  # v4.0.0
    with:
      pixi-environment: "ci"
      python-versions: '["3.12", "3.13"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-postgres: false
      editable-install: false
    secrets: inherit

  # Enforce main only accepts PRs from development
  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$HEAD_REF" != "development" ]; then
            echo "PRs to main must come from development branch"
            echo "   Source: $HEAD_REF"
            echo "   Expected: development"
            exit 1
          fi
          echo "PR from development to main - allowed"

  ci-success:
    # GitHub names direct caller-workflow jobs as just the job display name (no workflow prefix).
    # The check run emitted here is "CI Success" (not "CI / CI Success").
    # Branch protection must require: "CI Success"
    name: "CI Success"  # CRITICAL: Must match branch protection check name exactly
    runs-on: ubuntu-latest
    needs: [ci, branch-policy]
    if: always()
    steps:
      - name: Check CI status
        env:
          CI_RESULT: ${{ needs.ci.result }}
          POLICY_RESULT: ${{ needs.branch-policy.result }}
        run: |
          # branch-policy is skipped outside PRs to main; skipped is acceptable there.
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "CI failed with result: $CI_RESULT"
            exit 1
          fi
          if [[ "$POLICY_RESULT" == "failure" || "$POLICY_RESULT" == "cancelled" ]]; then
            echo "Branch Policy failed with result: $POLICY_RESULT"
            exit 1
          fi
          echo "CI passed"
