[project]
name = "quality-assurance"
version = "0.1.0"
description = "Quality Assurance MCP Server - Unified pixi-first quality assessment platform consolidating 26 quality functions into intelligent analysis"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MementoRC", email = "w3m3nt0.w0ri@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Claire-s-Monster/quality-assurance"
Repository = "https://github.com/Claire-s-Monster/quality-assurance"
Issues = "https://github.com/Claire-s-Monster/quality-assurance/issues"

[project.scripts]
quality-assurance-server = "quality_assurance.server:main"
quality-assurance = "quality_assurance.server:main"
quality-assurance-lean = "quality_assurance.lean_server:main"
quality-assurance-http = "quality_assurance.http_lean_server:main"
quality-assurance-http-server = "quality_assurance.http_lean_server:main"

# NOTE: Dependencies have been moved to [tool.pixi.*] sections below
# This ensures PIXI-only dependency management compliance
[project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_assurance", "src/core", "src/adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"  # Automatic async support
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--timeout=120",  # 2 minutes per test (CI Framework)
    "--timeout-method=thread",  # More robust for async
    "-ra",  # Show all test results
]
timeout = 120  # Default timeout for all tests
timeout_method = "thread"
markers = [
    "unit: Unit tests (fast, <30s timeout)",
    "integration: Integration tests (medium, <120s timeout)",
    "e2e: End-to-end tests (slow, <300s timeout)",
    "property: Property-based tests using hypothesis",
    "performance: Performance benchmark tests",
    "security: Security-focused tests",
    "slow: Slow tests (extended timeout)",
    "benchmark: Performance benchmark tests (no timeout)",
    "requires_external: Tests requiring external services",
    "requires_network: Tests requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
packages = ["quality_assurance", "core", "adapters"]
package_root = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Strictness settings (balanced approach)
strict = false  # Start permissive, increase gradually
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true  # Permissive for dependencies

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Test directory override
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# External dependencies - ignore missing imports
[[tool.mypy.overrides]]
module = [
    "hypothesis.*",
    "pytest.*",
    "ruff.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S", "ARG", "FBT"]

[tool.ruff.lint.isort]
known-first-party = ["quality_assurance", "core", "adapters"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["src/quality_assurance", "src/core", "src/adapters"]
branch = true
parallel = true
omit = [
    "tests/*",
    "src/quality_assurance/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 2
fail_under = 88  # Set to current achieved coverage (88.24%) to prevent regression

[tool.coverage.html]
directory = "htmlcov"
title = "Quality Assurance Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.paths]
source = [
    "src/quality_assurance",
    "*/src/quality_assurance",
    "src/core",
    "*/src/core",
    "src/adapters",
    "*/src/adapters",
]

# =============================================================================
# PIXI PROJECT CONFIGURATION (Optimized Linux-64 Strategy)
# =============================================================================
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]  # Linux-only for 50% faster local development
                          # Use --platform flag in CI for cross-platform validation
channel-priority = "disabled"  # Faster dependency resolution

# Ensure proper environment isolation (CI Framework pattern)
[tool.pixi.activation]
env = { PYTHONNOUSERSITE = "1" }

# =============================================================================
# CORE RUNTIME DEPENDENCIES
# =============================================================================
[tool.pixi.dependencies]
# Core Python and build system
python = ">=3.12,<3.14"  # Pin range to avoid surprise updates (currently resolving to 3.13.5)
hatchling = ">=1.18.0"  # Required for editable installs
fastmcp = ">=2.11,<3"  # Code/tests rely on the 2.x tool API (`.fn`)
mcp = ">=1.13,<2"      # mcp 2.x renamed McpError -> MCPError, breaking fastmcp 2.x
pydantic = ">=2.10"  # Data validation (required by FastMCP)
fastapi = ">=0.115.0"  # HTTP transport for MCP server
uvicorn = ">=0.31.0"   # ASGI server for HTTP transport

[tool.pixi.pypi-dependencies]
# Install project in editable mode
quality-assurance = { path = ".", editable = true }
# Runtime dependencies for MCP server
toml = ">=0.10.2"  # Required for pixi.toml parsing

# =============================================================================
# TIERED QUALITY FEATURES (CI Framework Best Practice)
# =============================================================================

# TIER 1: Essential Quality Gates (ZERO-TOLERANCE)
[tool.pixi.feature.quality.dependencies]
# Core Testing Framework (battle-tested versions)
pytest = ">=8.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
pytest-asyncio = ">=0.21.0"  # Async test support
pytest-xdist = ">=3.3.0"     # Parallel test execution

# Linting & Formatting (latest stable)
ruff = ">=0.7.3"

# Type Checking
mypy = ">=1.8.0"
types-toml = ">=0.10.8"  # Stubs for toml (mypy import-untyped)

[tool.pixi.feature.quality.pypi-dependencies]
# Test utilities only available on PyPI
toml = ">=0.10.2"        # For test fixtures
tomli-w = ">=1.0.0"      # For writing TOML in tests

# TIER 2: Extended Quality & Security
[tool.pixi.feature.quality-extended.dependencies]
# Security Scanning (CI Framework proven versions)
bandit = ">=1.7.0"       # Security linter
safety = ">=2.3.0,<3.0"  # Dependency vulnerability scanner
pip-audit = ">=2.6.0"    # Additional security auditing

# Code Quality Analysis
hypothesis = ">=6.0.0"    # Property-based testing
radon = ">=6.0.0"        # Complexity analysis
vulture = ">=2.7.0"      # Dead code detection

# Git Hooks
pre-commit = ">=3.0.0"

# TIER 3: CI/CD & Build Tools
[tool.pixi.feature.quality-ci.dependencies]
# Build & Publishing
python-build = ">=1.0.0"
twine = ">=4.0.0"

# CI Reporting (comprehensive coverage from UCKN)
pytest-html = ">=4.0.0"
pytest-json-report = ">=1.5.0"
pytest-benchmark = ">=4.0.0"
pytest-md = ">=0.2.0"
coverage = ">=7.0.0"
coverage-badge = ">=1.1.0"

# TIER 4: Development & Specialized Tools
[tool.pixi.feature.dev-specialized.dependencies]
# Performance & Profiling
memory_profiler = ">=0.61.0"

# Legacy development tools (backward compatibility)
black = ">=23.0.0"       # Keep for projects that need it
yamllint = ">=1.32.0"    # YAML linting

# Documentation
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"

# =============================================================================
# ENVIRONMENT CONFIGURATION (Tiered Performance Strategy)
# =============================================================================
[tool.pixi.environments]
# Basic runtime environment (minimal footprint)
default = {features = ["quality"], solve-group = "default"}  # includes pytest so bare `pixi run test` works

# Tiered quality environments (CI Framework proven approach)
# The *-gates / ci-build features hold only tasks (no dependencies). Each is
# attached to exactly one environment so `pixi run <task>` is not ambiguous
# (quality-gates -> ci). `test` is a default-feature task identical in every env,
# so bare `pixi run test` is unambiguous and the CI workflow's `-e <env> test`
# runs on that environment's interpreter.
quality = {features = ["quality"], solve-group = "default"}                                   # ~90s install - Essential quality tools
quality-extended = {features = ["quality", "quality-extended", "security-gates"], solve-group = "default"} # ~150s install - Full quality
quality-full = {features = ["quality", "quality-extended", "quality-ci"], solve-group = "default"} # ~180s install - Complete pipeline

# Development environment (full tooling)
dev = {features = ["quality", "quality-extended", "quality-ci", "dev-specialized"], solve-group = "default"} # ~250s install

# CI environment (optimized for CI performance)
ci = {features = ["quality", "quality-ci", "quality-gates"], solve-group = "default"}

# Build environment used by the reusable CI workflow's "Build Package" job
# (`pixi install -e quality-ci` then `pixi run -e quality-ci build`).
quality-ci = {features = ["quality-ci", "ci-build"], solve-group = "default"}  # ~120s install - CI optimized

# Per-Python-version CI environments (ci-framework pattern "py{nodot}"): each
# matrix leg of the reusable workflow runs `test` on its own interpreter.
py312 = {features = ["quality", "quality-ci", "py312"], solve-group = "py312"}
py313 = {features = ["quality", "quality-ci", "py313"], solve-group = "py313"}

# =============================================================================
# PIXI TASKS (Unified Best Practices from All Projects)
# =============================================================================
[tool.pixi.tasks]

# ===== TIER 1: CORE DEVELOPMENT TASKS (ESSENTIAL) =====

# Setup (the project installs itself editable via [tool.pixi.pypi-dependencies])
dev-setup = { cmd = "echo 'Development environment ready'", env = { PYTHONPATH = "src" } }

# Testing (ZERO-TOLERANCE QUALITY GATES) - Claude Code Integration
test = { cmd = "pytest tests/ -v --timeout=30", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-cov = { cmd = "pixi run -e quality pytest tests/ --cov=src/quality_assurance --cov=src/core --cov=src/adapters --cov-report=term-missing --cov-report=xml --timeout=60", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-fast = { cmd = "pixi run -e quality pytest tests/ -x --ff --timeout=30", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-unit = { cmd = "pixi run -e quality pytest tests/adapters/ tests/core/ -v --timeout=30", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-integration = { cmd = "pixi run -e quality pytest tests/integration/ -v --timeout=60", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-e2e = { cmd = "pixi run -e quality pytest tests/e2e/ -v --timeout=120", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }
test-property = { cmd = "pixi run -e quality pytest tests/ -m property -v --timeout=60", env = { QUALITY_ASSURANCE_TEST = "1", PYTHONPATH = "src" } }

# Quality Gates (lint, format, typecheck, quality) live in
# [tool.pixi.feature.quality-gates.tasks] below: ruff/mypy are not in the default env.

# Emergency Quality Fix - USE FOR "Found X errors" CI FAILURES
emergency-fix = "pixi run lint-fix && pixi run format && pixi run test"

# ===== TIER 2: SECURITY & COMPLIANCE TASKS =====

# Security scanning and static analysis (bandit, safety, pip-audit, radon,
# vulture, pre-commit) live in [tool.pixi.feature.security-gates.tasks] below.

# ===== TIER 3: CI/CD & DEPLOYMENT TASKS =====

# CI-specific variants (optimized) - Claude Code Integration
ci-test = { cmd = "pixi run -e ci pytest tests/ --cov=src/quality_assurance --cov=src/core --cov=src/adapters --cov-report=xml --timeout=90 --maxfail=1", env = { QUALITY_ASSURANCE_TEST = "1", ENVIRONMENT = "ci", PYTHONPATH = "src" } }
# ci-lint, ci-format-check, ci-typecheck: see [tool.pixi.feature.quality-gates.tasks]
# build: see [tool.pixi.feature.ci-build.tasks]

# Comprehensive Check (includes security). Spans the quality and quality-extended
# envs, so it chains two single-env tasks (same pattern as emergency-fix).
check-all = "pixi run quality && pixi run static-analysis"

# Cleanup
clean = "rm -rf __pycache__ .pytest_cache .coverage htmlcov .ruff_cache .mypy_cache dist build *.egg-info"
clean-envs = "rm -rf .pixi/envs/quality* .pixi/envs/ci .pixi/envs/dev"  # Environment cleanup

# ===== PROJECT-SPECIFIC TASKS =====
# Quality assurance specific tasks
shell-dev = { cmd = "python -m quality_assurance", env = { PYTHONPATH = "src" } }
mcp-server = { cmd = "python -m quality_assurance.server", env = { PYTHONPATH = "src" } }
server = { cmd = "python -m quality_assurance.server", env = { PYTHONPATH = "src" } }

# Lean MCP Server (reduced context consumption)
lean-server = { cmd = "python -m quality_assurance.lean_server", env = { PYTHONPATH = "src" } }
lean-mcp = { cmd = "python -m quality_assurance.lean_server", env = { PYTHONPATH = "src" } }

# HTTP/SSE MCP Server (lean transport on port 4106)
http-server = { cmd = "python -m quality_assurance.http_lean_server", env = { PYTHONPATH = "src" } }
http-lean-server = { cmd = "python -m quality_assurance.http_lean_server", env = { PYTHONPATH = "src" } }

# ===== LEGACY/SPECIALIZED TASKS =====

# Performance & Benchmarking
# pytest-benchmark is provided by the quality-ci feature (ci env), not quality
benchmark = "pixi run -e ci pytest tests/ -m benchmark --benchmark-only --benchmark-sort=mean"
benchmark-save = "pixi run -e ci pytest tests/ -m benchmark --benchmark-only --benchmark-save=baseline"
# docs-serve, docs-build: see [tool.pixi.feature.dev-specialized.tasks]

# Coverage Analysis (comprehensive - UCKN pattern)
test-coverage = "pixi run -e quality pytest tests/ --cov=src/quality_assurance --cov=src/core --cov=src/adapters --cov-branch --cov-report=html --cov-report=xml --cov-report=json --cov-report=term-missing"
# coverage-report, coverage-html: see [tool.pixi.feature.quality-gates.tasks]

# =============================================================================
# FEATURE-SCOPED TASKS (run in the env whose feature provides the tool)
# =============================================================================
[tool.pixi.feature.quality-gates.tasks]
# Quality Gates (CRITICAL - MUST PASS) - PREVENT CI FAILURES
lint = "ruff check src/ tests/ --select=F,E9"        # Critical violations only
lint-full = "ruff check src/ tests/"                  # Full linting
lint-fix = "ruff check --fix src/ tests/"             # Auto-fix violations
format = "ruff format src/ tests/"                    # Format code
format-check = "ruff format --check src/ tests/"      # Format validation
format-diff = "ruff format --diff src/ tests/"        # Show formatting changes
typecheck = "mypy src/"

# Combined Quality Check - MANDATORY BEFORE COMMIT
quality = { depends-on = ["test", "lint", "typecheck"] }

# CI variants
ci-lint = "ruff check src/ tests/ --output-format=github --select=F,E9"
ci-format-check = "ruff format --check src/ tests/"
ci-typecheck = "mypy src/ --no-error-summary"  # Cleaner CI output

# Coverage reports (coverage is a dependency of pytest-cov)
coverage-report = "coverage report --format=markdown"
coverage-html = "coverage html"

[tool.pixi.feature.security-gates.tasks]
# Security Scanning (CI Framework patterns)
security-scan = "bandit -r src/ --severity-level high --exclude tests/"
safety-check = "safety check --ignore=70929 --ignore=70912"  # Common false positives
pip-audit-scan = "pip-audit --verbose --desc"
complexity-check = "radon cc src/ --min B"
dead-code-check = "vulture src/ --min-confidence 80"

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan", "safety-check", "complexity-check"] }

# Pre-commit Integration - PREVENT CI FAILURES
pre-commit = { cmd = "pre-commit run --all-files", env = { QUALITY_ASSURANCE_TEST = "1" } }
install-pre-commit = { cmd = "pre-commit install --install-hooks", env = { QUALITY_ASSURANCE_TEST = "1" } }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.ci-build.tasks]
# Build & Deploy
build = "python -m build --no-isolation"

[tool.pixi.feature.dev-specialized.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"

# =============================================================================
# BANDIT SECURITY CONFIGURATION (CI Framework Pattern)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]  # Allow assert statements
targets = ["src"]